function claimed(c){let e=[...fishClaims.entries()].find(([,cid])=>cid===c.id);if(!e)return null;let f=objects.find(o=>o.id===e[0]);if(!f)fishClaims.delete(e[0]);return f||null}function ensureClaims(){for(let[fid,cid]of[...fishClaims])if(!objects.find(o=>o.id===fid)||!objects.find(o=>o.id===cid)||dyingCats.has(cid))fishClaims.delete(fid);let used=new Set(fishClaims.values());for(let f of fishes()){if(fishClaims.has(f.id))continue;let cand=cats().filter(c=>!used.has(c.id)).sort((a,b)=>dist(a,f)-dist(b,f)||({scared:0,normal:1,chonk:2}[a.catType]-{scared:0,normal:1,chonk:2}[b.catType]))[0];if(cand){fishClaims.set(f.id,cand.id);used.add(cand.id)}}}
function clearFight(c){for(let k of [...adjacencyTimers.keys()])if(k.split('|').includes(c.id)){adjacencyTimers.delete(k);fightLastHits.delete(k)}if(chonkTargetId===c.id||c.catType==='chonk'){chonkTargetId=null;chonkTargetSince=chonkLastHit=0}}function interruptCombatForFish(f){let near=cats().filter(c=>dist(c,f)===1),combat=near.filter(c=>c.id===chonkTargetId||(c.catType==='chonk'&&chonkTargetId)||[...adjacencyTimers].some(([k,s])=>k.split('|').includes(c.id)&&performance.now()-s>=FIGHT_TRIGGER));if(!combat.length)return;combat.sort((a,b)=>({scared:0,normal:1,chonk:2}[a.catType]-{scared:0,normal:1,chonk:2}[b.catType]));let c=combat[0];fishClaims.set(f.id,c.id);clearFight(c)}function towardFish(c,f){if(adj(c,f))return moveCat(c,f.x,f.y,()=>eat(c,f),fishSpeed(c),f);let moves=possible(c).sort((a,b)=>(Math.abs(a.x-f.x)+Math.abs(a.y-f.y))-(Math.abs(b.x-f.x)+Math.abs(b.y-f.y)));return moves[0]&&moveCat(c,moves[0].x,moves[0].y,null,fishSpeed(c),f)}function eat(c,f){let live=objects.find(o=>o.id===f.id);if(!live||live.x!==c.x||live.y!==c.y){fishClaims.delete(f.id);return}eatingCats.add(c.id);render();setTimeout(()=>{let still=objects.find(o=>o.id===f.id);if(still&&still.x===c.x&&still.y===c.y){objects=objects.filter(o=>o.id!==f.id);fishClaims.delete(f.id);c.crisis=Math.max(0,c.crisis-20)}render()},220);setTimeout(()=>{eatingCats.delete(c.id);render()},450)}
function hit(c){if(!c||dyingCats.has(c.id))return;c.crisis=Math.min(100,c.crisis+HIT_DAMAGE);hitCats.add(c.id);render();setTimeout(()=>{hitCats.delete(c.id);c.crisis>=100?kill(c):render()},250)}function kill(c){if(dyingCats.has(c.id))return;dyingCats.add(c.id);for(let[fid,cid]of[...fishClaims])if(cid===c.id)fishClaims.delete(fid);render();setTimeout(()=>{objects=objects.filter(o=>o.id!==c.id);dyingCats.delete(c.id);clearFight(c);render()},420)}function attack(a,t,impact){if(!a||!t||attackingCats.has(a.id)||movingCats.has(a.id)||eatingCats.has(a.id)||dyingCats.has(a.id)||dyingCats.has(t.id)||claimed(a)||claimed(t)||!adj(a,t))return;let tile=getTile(a.x,a.y),r=tile.getBoundingClientRect(),l=document.createElement('div');l.className='attackLunge';l.style.left=r.left+r.width/2+'px';l.style.top=r.top+r.height/2+'px';l.appendChild(makeCat(a));let dx=t.x-a.x,dy=t.y-a.y;l.classList.add(dx>0?'attackRight':dx<0?'attackLeft':dy<0?'attackUp':'attackDown');attackingCats.add(a.id);document.body.appendChild(l);setTimeout(()=>{if(!claimed(a)&&!claimed(t)&&adj(a,t))impact()},145);setTimeout(()=>{l.remove();attackingCats.delete(a.id);render()},330)}
function updateCombat(){if(!running)return;ensureClaims();let now=performance.now(),all=cats(),radio=getRadio(),ch=getChonk();if(radio){if(radio.active&&now>=radio.activeUntil){radio.active=false;render()}if(radio.active)for(let c of all)if(dist(radio,c)<=1)c.crisis=Math.max(0,c.crisis-RADIO_HEAL)}if(ch){if(claimed(ch)){chonkTargetId=null;ch.angry=false}else{let zone=all.filter(c=>c.id!==ch.id&&!claimed(c)&&adj(ch,c)),ids=new Set(zone.map(c=>c.id));ch.angry=zone.length>0;let target=zone.find(c=>c.id===chonkTargetId);if(!target){chonkTargetId=null;chonkTargetSince=chonkLastHit=0;if(zone.length){let fresh=zone.filter(c=>!previousChonkZoneCats.has(c.id)),pool=fresh.length?fresh:zone;target=pool[Math.floor(Math.random()*pool.length)];chonkTargetId=target.id;chonkTargetSince=now}}if(target&&now-chonkTargetSince>=CHONK_TRIGGER&&now-chonkLastHit>=CHONK_HIT_INTERVAL){chonkLastHit=now;attack(ch,target,()=>hit(target))}previousChonkZoneCats=ids}}let f=all.filter(c=>c.catType!=='chonk'&&!claimed(c)),active=new Set();for(let i=0;i<f.length;i++)for(let j=i+1;j<f.length;j++){let a=f[i],b=f[j],k=pair(a,b);if(adj(a,b)){active.add(k);if(!adjacencyTimers.has(k))adjacencyTimers.set(k,now);let together=now-adjacencyTimers.get(k);if(together>=FIGHT_TRIGGER&&(now-(fightLastHits.get(k)||0)>=FIGHT_HIT_INTERVAL)){fightLastHits.set(k,now);let idx=Math.floor((together-FIGHT_TRIGGER)/FIGHT_HIT_INTERVAL),att=idx%2===0?a:b,tar=att===a?b:a;attack(att,tar,()=>hit(tar))}}}for(let k of [...adjacencyTimers.keys()])if(!active.has(k)){adjacencyTimers.delete(k);fightLastHits.delete(k)}}
function updateCats(){if(!running)return;ensureClaims();for(let c of cats()){if(movingCats.has(c.id)||eatingCats.has(c.id)||attackingCats.has(c.id)||dyingCats.has(c.id))continue;let f=claimed(c);if(f){clearFight(c);if(c.x===f.x&&c.y===f.y)eat(c,f);else towardFish(c,f);continue}if(c.id===chonkTargetId)continue;let fighting=cats().some(o=>o.id!==c.id&&o.catType!=='chonk'&&c.catType!=='chonk'&&adjacencyTimers.has(pair(c,o))&&adj(c,o)&&performance.now()-adjacencyTimers.get(pair(c,o))>=FIGHT_TRIGGER);if(fighting)continue;if(c.catType==='chonk'){if(Math.random()>.02)continue}else if(Math.random()>.12)continue;let m=possible(c);if(m.length){let p=m[Math.floor(Math.random()*m.length)];moveCat(c,p.x,p.y)}}}
sail.onclick=()=>{if(sail.disabled)return;running=true;startTime=performance.now();presail.style.display='none';phase.textContent='SAILING';fishSource.style.display='flex';render()};function distanceLoop(){if(running){let p=Math.min(1,(performance.now()-startTime)/SESSION_MS),rem=Math.max(0,TOTAL_DISTANCE*(1-p));distanceFill.style.width=(1-p)*100+'%';distanceText.textContent=Math.ceil(rem)+'m';if(p>=1)finish()}requestAnimationFrame(distanceLoop)}function finish(){if(!running)return;running=false;fishSource.style.display='none';let r=getRadio();if(r)r.active=false;result.style.display='flex';document.querySelector('#resultTitle').textContent='ARRIVED!';document.querySelector('#resultInfo').textContent='120m completed.'}
function resetGame(){running=false;startTime=null;fishCounter=0;dragging=null;draggingFishSource=false;movingCats.clear();eatingCats.clear();dyingCats.clear();hitCats.clear();attackingCats.clear();reservedCatTiles.clear();fishClaims.clear();adjacencyTimers.clear();fightLastHits.clear();previousChonkZoneCats.clear();chonkTargetId=null;chonkTargetSince=0;chonkLastHit=0;objects=initialObjects();result.style.display='none';presail.style.display='block';fishSource.style.display='none';phase.textContent='PRE-SAIL · SET UP THE DECK';distanceFill.style.width='100%';distanceText.textContent='120m';ghost.style.display='none';clearHi();document.querySelectorAll('.movingCat,.attackLunge').forEach(e=>e.remove());render()}
const restart=document.querySelector('#restart');restart.onclick=()=>{restart.classList.remove('hop');void restart.offsetWidth;restart.classList.add('hop');setTimeout(resetGame,260)};
setInterval(updateCats,CAT_TICK);setInterval(updateCombat,COMBAT_TICK);distanceLoop();render();
</script></body></html>
